name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forwarder:
    runs-on: ubuntu-latest
    name: Go forwarder

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: forwarder/go.mod
          cache-dependency-path: forwarder/go.sum

      - name: Run Go tests
        working-directory: forwarder
        run: go test ./...

  linux:
    runs-on: ubuntu-latest
    name: "PHP ${{ matrix.php }} / Ubuntu"
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
          extensions: curl, pdo, sqlite3, session, mbstring

      - name: Build extension
        run: |
          phpize
          ./configure --enable-akari --enable-akari-debug
          make -j$(nproc)

      - name: Verify extension loads
        run: |
          php -d extension=$PWD/modules/akari.so \
            -d akari.enable=1 \
            -r '
              echo "akari version: " . phpversion("akari") . "\n";
              $fns = ["enable","createSpan","setTransactionName","addTag",
                      "getTags","logException","generateDistributedTracingHeaders",
                      "isProfiling","getSpansJson"];
              foreach ($fns as $f) {
                echo "  " . (function_exists("Akari\\$f") ? "✓" : "✗") . " $f\n";
              }
            '

      - name: Run tests
        run: |
          TEST_PHP_EXECUTABLE=$(which php) make test NO_INTERACTION=1

      - name: Show failures
        if: failure()
        run: |
          echo "=== Failed test output ==="
          for f in tests/*.out; do
            [ -f "$f" ] && echo "--- $(basename $f) ---" && cat "$f"
          done
          echo ""
          echo "=== Diffs ==="
          for f in tests/*.diff; do
            [ -f "$f" ] && echo "--- $(basename $f) ---" && cat "$f"
          done
          echo ""
          echo "=== Test result summary ==="
          cat tests/*.log 2>/dev/null | grep -E 'FAIL|PASS' | head -20

  macos:
    runs-on: macos-latest
    name: "PHP 8.5 / macOS"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install system dependencies
        run: brew install curl

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: curl, pdo, sqlite3, session, mbstring

      - name: Build extension
        run: |
          export CPPFLAGS="-I$(brew --prefix curl)/include"
          export LDFLAGS="-L$(brew --prefix curl)/lib"
          phpize
          ./configure --enable-akari --enable-akari-debug
          make -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: |
          TEST_PHP_EXECUTABLE=$(which php) make test NO_INTERACTION=1

      - name: Show failures
        if: failure()
        run: |
          echo "=== Failed test output ==="
          for f in tests/*.out; do
            [ -f "$f" ] && echo "--- $(basename $f) ---" && cat "$f"
          done
          echo ""
          echo "=== Diffs ==="
          for f in tests/*.diff; do
            [ -f "$f" ] && echo "--- $(basename $f) ---" && cat "$f"
          done
          echo ""
          echo "=== Test result summary ==="
          cat tests/*.log 2>/dev/null | grep -E 'FAIL|PASS' | head -20

  integrations:
    runs-on: ubuntu-latest
    name: Optional integrations

    services:
      redis:
        image: index.docker.io/library/redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 # ratchet:redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: index.docker.io/library/mysql@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209 # ratchet:mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      memcached:
        image: index.docker.io/library/memcached@sha256:7381333da6d6ae06e02d8dfc87ee6f2c7cd0a19f7ba048d5efc538d2100e2208 # ratchet:memcached:1.6-alpine
        ports:
          - 11211:11211

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libmemcached-dev zlib1g-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: curl, pdo, sqlite3, session, mbstring, redis, memcached, mysqli

      - name: Wait for services
        run: |
          php -r '
          function wait_port(string $name, int $port, int $timeout = 60): void {
              $deadline = time() + $timeout;
              do {
                  $socket = @fsockopen("127.0.0.1", $port, $errno, $errstr, 0.5);
                  if ($socket) {
                      fclose($socket);
                      echo "$name ready\n";
                      return;
                  }
                  usleep(500000);
              } while (time() < $deadline);
              fwrite(STDERR, "$name did not become ready on port $port\n");
              exit(1);
          }

          wait_port("redis", 6379);
          wait_port("memcached", 11211);

          mysqli_report(MYSQLI_REPORT_OFF);
          $deadline = time() + 90;
          do {
              $mysqli = mysqli_init();
              if (@mysqli_real_connect($mysqli, "127.0.0.1", "root", "", "", 3306)) {
                  mysqli_close($mysqli);
                  echo "mysql ready\n";
                  exit(0);
              }
              usleep(500000);
          } while (time() < $deadline);

          fwrite(STDERR, "mysql did not become ready\n");
          exit(1);
          '

      - name: Build extension
        run: |
          phpize
          ./configure --enable-akari --enable-akari-debug
          make -j$(nproc)

      - name: Run integration tests
        run: |
          TEST_PHP_EXECUTABLE=$(which php) make test NO_INTERACTION=1 TESTS='tests/150-redis-span.phpt tests/151-redis-nokey-command.phpt tests/152-redis-unknown-command-skipped.phpt tests/160-mysqli-query-span.phpt tests/161-mysqli-procedural-span.phpt tests/162-mysqli-transaction.phpt tests/170-memcached-span.phpt'

      - name: Show failures
        if: failure()
        run: |
          echo "=== Failed test output ==="
          for f in tests/*.out; do
            [ -f "$f" ] && echo "--- $(basename $f) ---" && cat "$f"
          done
          echo ""
          echo "=== Diffs ==="
          for f in tests/*.diff; do
            [ -f "$f" ] && echo "--- $(basename $f) ---" && cat "$f"
          done
          echo ""
          echo "=== Test result summary ==="
          cat tests/*.log 2>/dev/null | grep -E 'FAIL|PASS' | head -20

  asan:
    runs-on: ubuntu-latest
    name: ASan / UBSan
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # ratchet:docker/setup-buildx-action@v4

      # Build the sanitizer image. The PHP-from-source stage is the slow part
      # (~several minutes); GHA layer caching keeps it warm across runs so it
      # only rebuilds when Dockerfile.asan or the PHP_VERSION arg changes.
      - name: Build ASan image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # ratchet:docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.asan
          load: true
          tags: akari-asan:ci
          cache-from: type=gha,scope=asan
          cache-to: type=gha,scope=asan,mode=max

      # The container entrypoint builds the extension under ASan/UBSan and runs
      # the .phpt suite; a sanitizer hit aborts with a nonzero exit and fails
      # the job. Integration-only tests self-skip (no redis/mysql here).
      - name: Run test suite under sanitizers
        run: docker run --rm akari-asan:ci
